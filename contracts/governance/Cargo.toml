[package]
name = "workstone-governance"
version = "0.1.0"
edition = "2021"
publish = false
description = "Decentralized governance contract for WorkstoneEscrow protocol"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "21.0.0", features = [] }
workstone-shared = { path = "../shared" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
